<!DOCTYPE html>
<html lang='utf-8'>

<head>
    <meta charset='utf-8' />
    <title>雷达探点</title>
    <style type="text/css">
        body {
            background: #000;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        div {
            margin: auto;
            padding: 0;
            width: 1200px;
            position: relative;
        }

        .controls {
            margin-bottom: 10px;
        }

        select {
            margin-right: 20px;
        }

        input {
            margin-right: 20px;
        }

        button {
            margin: 10px 10px 10px 0;
            padding: 3px 5px;
            color: #000;
            cursor: pointer;
        }

        button[disabled=disabled] {
            color: #999;
            cursor: default;
        }

        .canvas-container {
            position: relative;
            cursor: default;
            /* 初始位置 */
            left: 0;
            top: 0;
            transition: none;
            /* 初始缩放比例 */
            transform-origin: 0 0;
            transform: scale(1);
        }

        canvas {
            background: transparent;
            cursor: default;
            position: absolute;
            top: 0;
            left: 0;
            width: 1200px;
            height: 600px;
        }

        /* 拖动开关样式优化 */
        #dragSwitch {
            margin-left: 20px;
        }

        .drag-enabled {
            cursor: move !important;
        }

        /* 缩放进度条样式 */
        .scale-control {
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #scaleSlider {
            width: 200px;
        }

        #scaleValue {
            color: #4CAF50;
            font-weight: bold;
            min-width: 60px;
        }
    </style>
</head>

<body>
    <div class="controls">
        <h1>雷达探点</h1>
        点数 <select id='pointNum'>
            <option value='1000'>1000</option>
            <option value='2000'>2000</option>
            <option value='3000'>3000</option>
        </select>
        扫描角度 <select id='angle'>
            <option value='15'>15</option>
            <option value='25'>25</option>
            <option value='35'>35</option>
        </select>
        速度 <select id='speed'>
            <option value='1'>慢速</option>
            <option value='2'>中速</option>
            <option value='3'>快速</option>
        </select>
        彩色点阵 <input type='checkbox' id='colorLength'>
        雷达网络 <input type='checkbox' id='raidLine'>
        <!-- 新增拖动开关 -->
        允许拖动 <input type='checkbox' id='dragSwitch'>
        <br />
        <button id='btInit'>生成点阵</button>
        <button id='btFind' disabled='disabled'>开始扫描</button>
        <button id='btMarker' disabled='disabled'>定位目标</button>

        <!-- 新增缩放进度条 -->
        <div class="scale-control">
            缩放比例:
            <input type="range" id="scaleSlider" min="10" max="200" value="100">
            <span id="scaleValue">100%</span>
        </div>
    </div>
    <!-- 修改canvas容器结构，便于拖动 -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id='canvasL' width='1200' height='600'></canvas>
        <canvas id='canvasP' width='1200' height='600'></canvas>
    </div>

    <script type="text/javascript">
        var canvasL, ctxL, canvasP, ctxP;
        var pointData1, pointData2;
        var point = [];
        var pointSize = 3;
        var pointNum = 10;
        var hide = 0;
        var colorLength = 1, color = ['white', 'green', 'blue', 'red', 'purple'];
        var speed = 1, angle = 35, ang = 0, radius = 280;
        var btInit, btFind, btMarker;
        var raf, find = false;
        var ts, te;

        // 拖动相关变量
        var canvasContainer, dragSwitch;
        var isDragging = false;
        var dragStartX, dragStartY;
        var containerLeft, containerTop;

        // 缩放相关变量
        var scaleSlider, scaleValueDisplay;
        var currentScale = 1.0; // 初始缩放比例 100%
        var scaleStep = 5; // 滚轮缩放步长（百分比）

        // 控件元素引用
        var angleSelect, speedSelect, raidLineCheckbox;

        window.onload = function () {
            btInit = document.querySelector('#btInit');
            btFind = document.querySelector('#btFind');
            btMarker = document.querySelector('#btMarker');
            canvasL = document.querySelector('#canvasL');
            canvasP = document.querySelector('#canvasP');
            ctxL = canvasL.getContext('2d');
            ctxP = canvasP.getContext('2d');

            // 获取控件引用
            angleSelect = document.querySelector('#angle');
            speedSelect = document.querySelector('#speed');
            raidLineCheckbox = document.querySelector('#raidLine');

            // 初始化拖动相关元素
            canvasContainer = document.getElementById('canvasContainer');
            dragSwitch = document.getElementById('dragSwitch');

            // 初始化缩放相关元素
            scaleSlider = document.getElementById('scaleSlider');
            scaleValueDisplay = document.getElementById('scaleValue');

            // 监听参数变化事件
            initParameterListeners();

            btInit.addEventListener('click', function () {
                btInit.setAttribute('disabled', 'disabled');
                btFind.setAttribute('disabled', 'disabled');
                btMarker.setAttribute('disabled', 'disabled');
                canvasP.style.cursor = 'default';
                find = false;
                main();
            });

            btFind.addEventListener('click', function () {
                btInit.setAttribute('disabled', 'disabled');
                btFind.setAttribute('disabled', 'disabled');
                btMarker.removeAttribute('disabled');
                canvasP.style.cursor = 'default';
                cancelAnimationFrame(raf);
                // 初始化当前参数
                angle = parseInt(angleSelect.value);
                speed = parseInt(speedSelect.value);
                ts = new Date().getTime();
                find = false;
                animation();
            });

            btMarker.addEventListener('click', function () {
                btInit.removeAttribute('disabled');
                btFind.removeAttribute('disabled');
                canvasP.style.cursor = 'crosshair';
                cancelAnimationFrame(raf);
                te = new Date().getTime();
                marker();
            });

            canvasP.addEventListener('click', function (event) {
                if (!find) return;
                btFind.setAttribute('disabled', 'disabled');
                btMarker.setAttribute('disabled', 'disabled');
                var rect = this.getBoundingClientRect();
                // 修正点击坐标，适配缩放比例
                var scale = currentScale;
                var x = Math.floor((event.clientX - rect.left) / scale) - 300;
                var y = Math.floor((event.clientY - rect.top) / scale) - 300;
                if (x > 300) x -= 300;
                point.push([x, y, 0]);
                find = false;
                result();
            });

            // 初始化拖动功能
            initDragFunctionality();

            // 初始化缩放功能（进度条+滚轮）
            initScaleFunctionality();
        }

        // 初始化参数监听器
        function initParameterListeners() {
            // 监听扫描角度变化
            angleSelect.addEventListener('change', function () {
                if (raf) { // 如果正在扫描
                    angle = parseInt(this.value);
                }
            });

            // 监听速度变化
            speedSelect.addEventListener('change', function () {
                if (raf) { // 如果正在扫描
                    speed = parseInt(this.value);
                }
            });

            // 监听雷达网络变化
            raidLineCheckbox.addEventListener('change', function () {
                // 立即更新雷达网络显示
                if (this.checked) {
                    ctxL.clearRect(0, 0, 1200, 600);
                    ctxL.strokeStyle = '#345';
                    ctxL.lineWidth = 1;
                    drawLine(ctxL, 300, 300);
                    drawLine(ctxL, 900, 300);
                } else {
                    ctxL.clearRect(0, 0, 1200, 600);
                }

                // 如果正在扫描，重新绘制确保雷达网络变更生效
                if (raf) {
                    // 临时暂停动画，刷新后继续
                    cancelAnimationFrame(raf);
                    animation();
                }
            });
        }

        // 初始化拖动功能
        function initDragFunctionality() {
            // 拖动开关事件
            dragSwitch.addEventListener('change', function () {
                if (this.checked) {
                    canvasContainer.classList.add('drag-enabled');
                } else {
                    canvasContainer.classList.remove('drag-enabled');
                    isDragging = false; // 取消拖动状态
                }
            });

            // 鼠标按下事件
            canvasContainer.addEventListener('mousedown', function (e) {
                // 只有开启拖动开关且不是右键点击才允许拖动
                if (!dragSwitch.checked || e.button === 2) return;

                isDragging = true;
                // 获取初始位置
                dragStartX = e.clientX;
                dragStartY = e.clientY;

                // 获取容器当前位置
                containerLeft = parseInt(window.getComputedStyle(canvasContainer).left) || 0;
                containerTop = parseInt(window.getComputedStyle(canvasContainer).top) || 0;

                // 阻止默认行为和冒泡
                e.preventDefault();
                e.stopPropagation();
            });

            // 鼠标移动事件
            document.addEventListener('mousemove', function (e) {
                if (!isDragging || !dragSwitch.checked) return;

                // 计算偏移量
                var deltaX = e.clientX - dragStartX;
                var deltaY = e.clientY - dragStartY;

                // 更新容器位置
                canvasContainer.style.left = (containerLeft + deltaX) + 'px';
                canvasContainer.style.top = (containerTop + deltaY) + 'px';

                e.preventDefault();
            });

            // 鼠标释放事件
            document.addEventListener('mouseup', function () {
                isDragging = false;
            });

            // 鼠标离开窗口事件
            document.addEventListener('mouseleave', function () {
                isDragging = false;
            });

            // 禁用右键菜单
            canvasContainer.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });
        }

        // 初始化缩放功能（进度条+滚轮）
        function initScaleFunctionality() {
            // 更新缩放显示
            function updateScale(scalePercent) {
                // 限制缩放范围在10%~200%
                scalePercent = Math.max(10, Math.min(200, scalePercent));
                currentScale = scalePercent / 100;
                // 设置缩放变换
                canvasContainer.style.transform = `scale(${currentScale})`;
                // 更新显示值
                scaleValueDisplay.textContent = `${scalePercent}%`;
                // 更新滑块值
                scaleSlider.value = scalePercent;
            }

            // 滑块拖动事件
            scaleSlider.addEventListener('input', function () {
                var scalePercent = parseInt(this.value);
                updateScale(scalePercent);
            });

            // 鼠标滚轮缩放事件
            canvasContainer.addEventListener('wheel', function (e) {
                e.preventDefault(); // 阻止页面滚动

                // 获取当前缩放百分比
                var currentScalePercent = parseInt(scaleSlider.value);

                // 滚轮向上（放大），向下（缩小）
                if (e.deltaY < 0) {
                    // 向上滚动 - 放大
                    updateScale(currentScalePercent + scaleStep);
                } else {
                    // 向下滚动 - 缩小
                    updateScale(currentScalePercent - scaleStep);
                }
            }, { passive: false });

            // 支持直接输入数值
            scaleValueDisplay.addEventListener('click', function () {
                var newScale = prompt('请输入缩放比例 (10-200):', currentScale * 100);
                if (newScale !== null) {
                    newScale = parseInt(newScale);
                    if (!isNaN(newScale) && newScale >= 10 && newScale <= 200) {
                        updateScale(newScale);
                    } else {
                        alert('请输入10到200之间的有效数字');
                    }
                }
            });

            // 初始化缩放值
            updateScale(parseInt(scaleSlider.value));
        }

        function main() {
            // 初始化雷达网络
            if (raidLineCheckbox.checked) {
                ctxL.strokeStyle = '#345';
                ctxL.lineWidth = 1;
                drawLine(ctxL, 300, 300);
                drawLine(ctxL, 900, 300);
            } else {
                ctxL.clearRect(0, 0, 1200, 600);
            }

            pointNum = parseInt(document.querySelector('#pointNum').value);
            if (document.querySelector('#colorLength').checked) colorLength = color.length;
            else colorLength = 1;

            ctxP.clearRect(0, 0, 1200, 600);
            ctxP.lineWidth = 1;
            ctxP.strokeStyle = '#ccc';
            pointData1 = ctxP.createImageData(600, 600);
            pointData2 = ctxP.createImageData(600, 600);

            var k = 0;
            point = [];
            hide = Math.floor(Math.random() * pointNum);
            var draw = setInterval(function () {
                var x, y;
                for (var i = 0; i < 30; i++) {
                    do {
                        x = Math.floor(Math.random() * radius * 2 - radius);
                        y = Math.floor(Math.random() * radius * 2 - radius);
                    } while (x * x + y * y > radius * radius)
                    var c = Math.floor(Math.random() * colorLength);
                    if (checkPoint(x, y, c)) {
                        k++;
                        drawPoint(ctxP, x, y, c);
                        point.push([x, y, c]);
                    }
                    if (k >= pointNum) {
                        clearInterval(draw);
                        pointData1 = ctxP.getImageData(0, 0, 600, 600);
                        pointData2 = ctxP.getImageData(600, 0, 600, 600);
                        btInit.removeAttribute('disabled');
                        btFind.removeAttribute('disabled');
                        break;
                    }
                };
            }, 30);
        }

        function drawLine(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            for (var i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(0, 0, 85 + i * 100, 0, 2 * Math.PI);
                ctx.stroke();
            };
            for (var i = 0; i < 6; i++) {
                ctx.rotate(Math.PI * 30 / 180);
                ctx.moveTo(-285, 0);
                ctx.lineTo(285, 0);
                ctx.stroke();
            };
            ctx.restore();
        }

        function drawPoint(ctx, x, y, c) {
            ctx.fillStyle = color[c];
            ctx.fillRect(300 + x, 300 + y, pointSize, pointSize);
            if (hide != point.length)
                ctx.fillRect(300 + x + 600, 300 + y, pointSize, pointSize);
        }

        function drawArc(ctx, x, y, ang) {
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(x, y);
            // 使用当前最新的angle值
            ctx.arc(x, y, radius + 10, Math.PI * ang / 180, Math.PI * (360 - angle + ang) / 180);
            ctx.fill();
        }

        // 修复checkPoint函数参数错误
        function checkPoint(x, y, c) {
            // 检查坐标边界
            if (x < -radius || x > radius || y < -radius || y > radius) return false;

            var p = ctxP.getImageData(300 + x, 300 + y, pointSize, pointSize);
            var pc = p.data;
            for (var i = 0; i < pc.length; i += 4) {
                if (pc[i] != 0 || pc[i + 1] != 0 || pc[i + 2] != 0) {
                    return false;
                }
            };
            return true;
        }

        function animation() {
            ctxP.putImageData(pointData1, 0, 0);
            ctxP.putImageData(pointData2, 600, 0);
            drawArc(ctxP, 300, 300, ang);
            drawArc(ctxP, 900, 300, ang);
            // 使用当前最新的speed值
            ang += speed;
            raf = window.requestAnimationFrame(animation);
        }

        function marker() {
            ctxP.clearRect(600, 0, 600, 600);
            ctxP.putImageData(pointData1, 0, 0);
            find = true;
        }

        function result() {
            ctxP.lineWidth = 3;
            ctxP.putImageData(pointData2, 600, 0);
            ctxP.strokeStyle = 'orange';
            ctxP.strokeRect(point[pointNum][0] - 10 + 300, point[pointNum][1] - 10 + 300, 20, 20);
            ctxP.strokeRect(point[pointNum][0] - 10 + 600 + 300, point[pointNum][1] - 10 + 300, 20, 20);
            ctxP.strokeStyle = 'red';
            ctxP.strokeRect(point[hide][0] - 10 + 300, point[hide][1] - 10 + 300, 20, 20);
            ctxP.strokeRect(point[hide][0] - 10 + 600 + 300, point[hide][1] - 10 + 300, 20, 20);
            if (Math.abs(point[hide][0] - point[pointNum][0]) < 10 && Math.abs(point[hide][1] - point[pointNum][1]) < 10) {
                alert('success \n' + 'time ' + (te - ts) + ' ms');
            } else {
                alert('error \n' + 'time ' + (te - ts) + ' ms');
            }
        }
    </script>

</body>

</html>
